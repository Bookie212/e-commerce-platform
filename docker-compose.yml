services:
  db:
    image: postgres:15
    container_name: my_postgres_ecommerce
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    image: ecommerce-backend:latest
    build: ./backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/ecommerce
    ports:
      - "8000:8000"

  nginx:
    image: ecommerce-nginx:latest
    build: ./nginx
    depends_on:
      - backend
    ports:
      - "80:80"


volumes:
    db_data: